[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spaceplan"
version = "0.1.0"
description = "Schematic space planning for Municipal Permit Intelligence (steps 1-2: brief/package schemas and capacity layer)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "shapely>=2.0",
    "numpy>=1.24",
    "jsonschema>=4.18",
    "networkx>=3.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "matplotlib>=3.7"]

[project.scripts]
spaceplan = "spaceplan.main.cli:main"

[tool.setuptools.packages.find]
include = ["spaceplan*"]

[tool.setuptools.package-data]
spaceplan = ["data/schemas/*.json", "data/rules/*.json", "data/briefs/*.json", "data/catalog/*.json",
             "data/catalog/fragments/*.json", "contracts/schemas/*.json", "contracts/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
